<label class="checkbox">
  <input type="checkbox" />
  <div class="checkmark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <g
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect
          x="1.5"
          y="1.5"
          width="21"
          height="21"
          rx="5"
          ry="5"
          stroke-width="3"
        ></rect>
        <polyline points="7 10 12 16 22 2" stroke-width="4"></polyline>
      </g>
    </svg>
    <span>Option</span>
  </div>
</label>
