

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LineTop | 个人主页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b1020;
      color: #e9eefb;
      font-family: system-ui, sans-serif;
      line-height: 1.7;
    }
    main {
      max-width: 850px;
      margin: auto;
      padding: 70px 24px;
    }
    h1 { font-size: clamp(36px, 7vw, 60px); margin: 8px 0; }
    h2 { margin-top: 55px; }
    p { color: #aab7d1; }
    .accent { color: #71b7ff; }
    .tag {
      color: #71b7ff;
      font-size: 14px;
      letter-spacing: 2px;
    }
    .card {
      background: #151d32;
      border: 1px solid #293450;
      border-radius: 16px;
      padding: 24px;
      margin: 16px 0;
    }
    a { color: #71b7ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer {
      margin-top: 75px;
      color: #7886a2;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="tag">WELCOME TO MY SPACE</div>
      <h1>你好，我是 <span class="accent">LineTop.</span></h1>
      <p>软件开发学习者 / AI 爱好者 / 探索者</p>
      <p>欢迎来到我的互联网小空间。</p>
    </header>

    <section>
      <h2>关于我</h2>
      <p>
        我正在学习软件开发、机器学习和人工智能。
        喜欢探索有趣的技术，并尝试将想法变成真实的项目。
      </p>
    </section>

    <section>
      <h2>技术方向</h2>
      <div class="card">
        Python · Java · Web Development
      </div>
      <div class="card">
        Machine Learning · Deep Learning
      </div>
    </section>

    <section>
      <h2>我的项目</h2>
      <div class="card">
        <h3>个人主页</h3>
        <p>我的第一个公开网站，持续更新中。</p>
      </div>
      <div class="card">
        <h3>未来项目</h3>
        <p>这里会展示我的编程作品和技术实验。</p>
      </div>
    </section>

    <section>
      <h2>联系我</h2>
      <p>
        <a href="https://github.com/linefantasy">
          我的 GitHub
        </a>
      </p>
    </section>

    <footer>© 2026 LineTop · linetop.top</footer>
  </main>
</body>
</html>
